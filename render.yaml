services:
  - type: web
    name: mynsut-backend
    env: node
    plan: free
    region: singapore
    buildCommand: npm run build --workspace @mynsut/shared && npm run prisma:generate --workspace backend && npm run build --workspace backend
    # --------------------------------------------------------------------------
    # Database Lifecycle & Pre-Deploy Configuration:
    # --------------------------------------------------------------------------
    # preDeployCommand runs before the new service instance starts taking traffic.
    # We strictly run transactional Prisma migrations here using DIRECT_URL.
    #
    # WHY SEEDING IS DECOUPLED FROM ROUTINE DEPLOYMENTS:
    # 1. Deployment Latency: Running upserts across hundreds of cohort classes,
    #    subjects, and demo records on every build increases pre-deploy time
    #    and delays zero-downtime rolling container swaps.
    # 2. Unwanted Data Re-creation: prisma/seed.ts populates sample academic
    #    resources. Running it on every deploy would resurrect demo resources
    #    that administrators intentionally removed or updated in production.
    # 3. Constraint Collision Hazard: Live administrative modifications to classes,
    #    sections, or subjects could conflict with hardcoded seed definitions,
    #    causing unexpected pre-deploy command failure and aborting rollouts.
    #
    # WHEN SEEDING IS APPROPRIATE:
    # - Execute ONCE upon initial deployment to a fresh database branch to populate
    #   system roles (SUPER_ADMIN, STUDENT, CLASS_CR, SOCIETY_*), permissions,
    #   role-permission mappings, baseline academic classes, and Super Admin.
    #
    # HOW TO PERFORM THE INITIAL SEED MANUALLY:
    # Note: Render Free tier does not include Dashboard Shell/SSH access.
    # Production database seeding is executed exclusively through the secure,
    # manually triggered GitHub Actions workflow:
    # Actions -> "Production Database Seed" (workflow_dispatch) -> type "SEED_PRODUCTION"
    # --------------------------------------------------------------------------
    preDeployCommand: npm run prisma:deploy --workspace backend
    startCommand: npm run start --workspace backend
    healthCheckPath: /api/v1/health?readiness=true
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: /api/v1
      - key: APP_NAME
        value: MyNSUT API
      - key: LOG_LEVEL
        value: combined
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: FRONTEND_AUTH_SUCCESS_URL
        sync: false
      - key: FRONTEND_AUTH_FAILURE_URL
        sync: false
      - key: SESSION_COOKIE_NAME
        value: mynsut_session
      - key: REDIS_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
