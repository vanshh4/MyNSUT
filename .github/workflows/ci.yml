name: CI Quality Gate

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: mynsut_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: "true"
      NODE_ENV: "test"
      DATABASE_URL: "postgresql://postgres:password@localhost:5432/mynsut_test?schema=public"
      DIRECT_URL: "postgresql://postgres:password@localhost:5432/mynsut_test?schema=public"
      AUTH_SECRET: "ci-test-auth-secret-minimum-32-characters-long"
      GOOGLE_CLIENT_ID: "ci-mock-google-client-id.apps.googleusercontent.com"
      GOOGLE_CLIENT_SECRET: "ci-mock-google-client-secret"
      GOOGLE_CALLBACK_URL: "http://localhost:3000/api/backend/auth/google/callback"
      FRONTEND_AUTH_SUCCESS_URL: "http://localhost:3000/auth/callback"
      FRONTEND_AUTH_FAILURE_URL: "http://localhost:3000/auth/error"
      SESSION_COOKIE_NAME: "mynsut_session"
      BACKEND_INTERNAL_URL: "https://backend.example.invalid"
      NEXT_PUBLIC_APP_NAME: "MyNSUT"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_PUBLIC_API_BASE_URL: "/api/backend"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace backend

      - name: Build shared package
        run: npm run build:shared

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Lint all workspaces
        run: npm run lint

      - name: Apply Prisma migrations
        run: npm run prisma:deploy --workspace backend

      - name: Run backend tests
        run: npm run test:backend

      - name: Run frontend tests
        run: npm run test:frontend

      - name: Build backend
        run: npm run build:backend

      - name: Build frontend
        run: npm run build:frontend
